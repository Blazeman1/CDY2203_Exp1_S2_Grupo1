services:
  mysql-db:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: seguridad-calidad-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: seguridad_calidad_db
      MYSQL_USER: myuser
      MYSQL_PASSWORD: password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: seguridad-calidad-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/seguridad_calidad_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: myuser
      DB_PASS: password
      JWT_SECRET: mi-clave-super-secreta-de-32-caracteres-minimo
      JWT_EXPIRATION_MS: 3600000
    depends_on:
      mysql-db:
        condition: service_healthy

  apache-proxy:
    build:
      context: ./docker/apache-proxy
    container_name: seguridad-calidad-proxy
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - app

volumes:
  mysql-data: