# Configuracion de la aplicacion
spring.application.name=seguridad-calidad

# Configuracion de la base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/seguridad_calidad_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
security.jwt.secret=${JWT_SECRET:mi-clave-super-secreta-de-32-caracteres-minimo}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}


