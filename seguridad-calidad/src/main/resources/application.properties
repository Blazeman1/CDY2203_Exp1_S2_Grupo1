spring.application.name=seguridad-calidad

# Configuracion de la base de datos
spring.datasource.url=jdbc:mysql://mysql-db:3306/seguridad_calidad_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=myuser
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
security.jwt.secret=mi-clave-super-secreta-de-32-caracteres-minimo
security.jwt.expiration-ms=3600000